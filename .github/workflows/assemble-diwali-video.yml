name: Assemble uploaded Diwali video
on:
  push:
    branches: [main]
    paths:
      - "assets/diwali/media-parts/part-06.b64"
permissions:
  contents: write
concurrency:
  group: assemble-diwali-media
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Rebuild MP4 from uploaded base64 parts
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          folder = Path("assets/diwali/media-parts")
          parts = [folder / f"part-{i:02d}.b64" for i in range(1, 7)]
          payload = "".join(p.read_text(encoding="ascii").strip() for p in parts)
          data = base64.b64decode(payload, validate=True)
          if len(data) < 10000:
              raise SystemExit("Decoded video is unexpectedly small")
          target = Path("assets/diwali/jethalal-surprise.mp4")
          target.write_bytes(data)
          for part in parts:
              part.unlink()
          print(f"Created {target} ({len(data)} bytes)")
          PY
      - name: Commit generated video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/diwali/jethalal-surprise.mp4 assets/diwali/media-parts
          git commit -m "Add optimized Jethalal surprise video asset"
          git push
